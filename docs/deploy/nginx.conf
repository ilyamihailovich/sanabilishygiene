# /etc/nginx/sites-available/hygiene.sanabilis.ru
# Сертификат: certbot --nginx -d hygiene.sanabilis.ru

# Токен ссылки пациента не попадает в журнал nginx
map $request_uri $loggable_uri {
    ~^/p/[^/?]+(?<rest>.*)$  /p/***$rest;
    default                  $request_uri;
}
log_format sanabilis '$remote_addr - [$time_local] "$request_method $loggable_uri" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name hygiene.sanabilis.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hygiene.sanabilis.ru;

    ssl_certificate     /etc/letsencrypt/live/hygiene.sanabilis.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hygiene.sanabilis.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/sanabilis.access.log sanabilis;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 5m;

    # Внутренние страницы для сервиса PDF доступны только из сети контейнеров
    location ^~ /print/  { return 404; }
    location ^~ /render/ { return 404; }

    # Модели и шрифты кешируются браузером
    location ~* ^/(models|fonts)/ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
