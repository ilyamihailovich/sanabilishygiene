# SANABILIS Гигиена: приложение, база, сервис PDF, резервное копирование.
# Запуск: cp .env.example .env (заполнить) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RENDERER_URL: http://renderer:3100
      INTERNAL_APP_URL: http://app:3000
      DATA_DIR: /app/data
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # только для просмотра на своём компьютере (.env.demo); на рабочем сервере не включать
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - app-data:/app/data
      # шрифты, логотип и 3D-модель клиники можно подменять без пересборки
      - ./public/fonts:/app/public/fonts:ro
      - ./public/models:/app/public/models:ro
    ports:
      - '127.0.0.1:3000:3000'

  renderer:
    build: ./renderer
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: http://app:3000
    shm_size: 512m

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      DATA_DIR: /app-data
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - app-data:/app-data:ro
    entrypoint: ['/bin/sh', '-c', 'apk add --no-cache openssl rsync openssh-client >/dev/null; while true; do /bin/sh /backup.sh; sleep 86400; done']

volumes:
  db-data:
  app-data:
